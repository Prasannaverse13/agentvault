# Render Blueprint: one free web service that runs the agent and serves the web app,
# so the whole project lives behind a single URL.
services:
  - type: web
    name: agentvault
    runtime: node
    plan: free
    # NODE_ENV=development only for the install step so dev tools (tsx, typescript, tailwind)
    # are installed. next build sets production itself.
    buildCommand: NODE_ENV=development pnpm install --frozen-lockfile --filter "@agentvault/web..." --filter "@agentvault/agent..." && NODE_OPTIONS=--max-old-space-size=460 pnpm --filter @agentvault/web build
    startCommand: pnpm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: FACTORY_ADDRESS
        value: "0x0Eb2cD465946e7eac309bCF311Dbd2Dd5cc7C31d"
      - key: NEXT_PUBLIC_FACTORY_ADDRESS
        value: "0x0Eb2cD465946e7eac309bCF311Dbd2Dd5cc7C31d"
      - key: VAULT_ADDRESS
        value: "0xAbb30839FE657D59b4CBCbB737f4af896c5a8b62"
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
      - key: AGENT_EXECUTE
        value: "true"
      # Secrets: you are prompted for these when the Blueprint is created. Never put them in git.
      - key: AGENT_PRIVATE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
